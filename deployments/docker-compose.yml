services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routingnms}
      POSTGRES_USER: ${POSTGRES_USER:-routingnms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js"]
    volumes:
      - nats-data:/data

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.126.0
    restart: unless-stopped
    command: ["-storageDataPath=/storage"]
    volumes:
      - victoria-data:/storage

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
      - nats
      - victoria-metrics
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  nats-data:
  victoria-data:
